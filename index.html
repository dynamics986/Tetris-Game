<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080a12">
    <title>Neon Tetris</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app" aria-label="Neon Tetris game">
      <section class="hud hud-left" aria-label="Game statistics">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <h1>Neon Tetris</h1>
            <p>Arcade stacker</p>
          </div>
        </div>

        <div class="stats-grid">
          <article class="stat">
            <span>Score</span>
            <strong id="score">0</strong>
          </article>
          <article class="stat">
            <span>Level</span>
            <strong id="level">1</strong>
          </article>
          <article class="stat">
            <span>Lines</span>
            <strong id="lines">0</strong>
          </article>
          <article class="stat">
            <span>Best</span>
            <strong id="high-score">0</strong>
          </article>
        </div>

        <button class="primary-action" id="start-button" type="button">Start Game</button>
        <button class="secondary-action" id="pause-button" type="button" disabled>Pause</button>
      </section>

      <section class="stage" aria-label="Tetris board">
        <div class="board-shell">
          <canvas id="board" width="300" height="600" aria-label="10 by 20 Tetris board"></canvas>
          <div class="state-overlay" id="overlay">
            <div class="overlay-panel">
              <span id="overlay-kicker">Ready</span>
              <h2 id="overlay-title">Neon Tetris</h2>
              <p id="overlay-copy">Stack blocks, clear lines, chase the glow.</p>
              <button id="overlay-button" type="button">Start</button>
            </div>
          </div>
        </div>
      </section>

      <section class="hud hud-right" aria-label="Next piece and controls">
        <article class="next-card">
          <span>Next</span>
          <canvas id="next" width="128" height="128" aria-label="Next tetromino preview"></canvas>
        </article>

        <div class="control-card">
          <span>Keys</span>
          <div class="key-list" aria-label="Keyboard controls">
            <kbd>←</kbd><b>Move</b>
            <kbd>→</kbd><b>Move</b>
            <kbd>↑</kbd><b>Rotate</b>
            <kbd>↓</kbd><b>Soft</b>
            <kbd>Space</kbd><b>Drop</b>
          </div>
        </div>
      </section>

      <nav class="touch-controls" aria-label="Touch controls">
        <button class="touch-btn" data-action="left" type="button" aria-label="Move left">←</button>
        <button class="touch-btn" data-action="right" type="button" aria-label="Move right">→</button>
        <button class="touch-btn" data-action="rotate" type="button" aria-label="Rotate">↻</button>
        <button class="touch-btn" data-action="soft" type="button" aria-label="Soft drop">↓</button>
        <button class="touch-btn wide" data-action="hard" type="button" aria-label="Hard drop">Drop</button>
      </nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>
